<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F5EBC9">
  <title>数字日记</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='22' height='26' rx='4' fill='%23F3D88A' stroke='%237A4F06' stroke-width='2'/%3E%3Cpath d='M10 10h12M10 15h12M10 20h7' stroke='%237A4F06' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <!-- 预加载首屏一定会用到的模块，避免 import 一层层串行请求 -->
  <link rel="modulepreload" href="js/main.js">
  <link rel="modulepreload" href="js/lib.js">
  <link rel="modulepreload" href="js/upload.js">
  <link rel="modulepreload" href="js/viewer.js">
  <link rel="modulepreload" href="js/dialogs.js">
  <link rel="modulepreload" href="js/gallery.js">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark"><svg viewBox="0 0 32 32"><rect x="5" y="3" width="22" height="26" rx="4"/><path d="M10 10h12M10 15h12M10 20h7"/></svg></span>
        <span class="brand-text"><b>数字日记</b><small>纸与影像的索引</small></span>
      </a>
      <form class="side-search" id="sideSearch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input type="search" name="q" placeholder="搜索或输入编号" autocomplete="off">
        <kbd>/</kbd>
      </form>
      <button class="btn primary block" id="sideUpload">
        <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>上传到图库
      </button>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <div class="main-col">
      <header class="mobile-top" id="mobileTop">
        <a class="brand" href="#/"><span class="brand-mark"><svg viewBox="0 0 32 32"><rect x="5" y="3" width="22" height="26" rx="4"/><path d="M10 10h12M10 15h12M10 20h7"/></svg></span><b id="mobileTitle">数字日记</b></a>
        <div class="mobile-actions">
          <button class="icon-btn" id="mUpload" aria-label="上传"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></button>
          <button class="icon-btn" id="mMore" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
        </div>
      </header>
      <main id="app" class="main"></main>
    </div>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <input type="file" id="globalFile" multiple hidden>
  <div id="uploadPanel" class="upload-panel" hidden></div>
  <div id="selectBar" class="select-bar" hidden></div>
  <div id="dropOverlay" class="drop-overlay" hidden><div><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><b>松开即可上传</b><span id="dropHint">文件会放入图库</span></div></div>
  <div id="viewer" class="viewer" hidden></div>
  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/jsQR.js" defer></script>
  <script src="js/main.js" type="module"></script>
</body>
</html>
